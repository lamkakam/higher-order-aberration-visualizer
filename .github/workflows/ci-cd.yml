name: CI/CD

on:
  pull_request:
    branches:
      - main
      - 'v*'
  push:
    branches:
      - main
      - 'v*'
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect documentation-only pull request
        id: changes
        run: node scripts/detect-docs-only.mjs

      - name: Skip full CI for documentation-only changes
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only pull request - full CI skipped"

      - name: Set up Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Type check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build

      - name: End-to-end tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run e2e
