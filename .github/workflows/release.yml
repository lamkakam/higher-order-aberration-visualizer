name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: End-to-end tests
        run: npm run e2e

      - name: Package dist
        run: zip -r "higher-order-aberration-visualizer-${GITHUB_REF_NAME}-dist.zip" dist

      - name: Prepare Cloudflare Pages artifact
        run: npm run prepare:cloudflare

      - name: Upload Cloudflare Pages artifact
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-pages
          path: cloudflare-pages
          retention-days: 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "higher-order-aberration-visualizer-${GITHUB_REF_NAME}-dist.zip" --generate-notes

  deploy-cloudflare:
    name: Deploy Cloudflare Pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true
    environment:
      name: cloudflare-pages
      url: https://higher-order-aberration-visualizer.vestibulum.xyz/
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download Cloudflare Pages artifact
        uses: actions/download-artifact@v7
        with:
          name: cloudflare-pages
          path: cloudflare-pages

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare-pages --project-name=higher-order-aberration-visualizer --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
